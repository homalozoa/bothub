# Separate vhosts: preserve all other host Nginx sites. No request queries/cookies in access logs.
log_format openzoo '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name openzoo.ai hub.openzoo.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openzoo.ai;
    ssl_certificate /etc/letsencrypt/live/openzoo.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openzoo.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/openzoo/public;
    index index.html;
    autoindex off;
    disable_symlinks on;
    access_log /var/log/nginx/openzoo.access.log openzoo;
    error_log /var/log/nginx/openzoo.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location ~ /\. { return 404; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.openzoo.ai;
    ssl_certificate /etc/letsencrypt/live/openzoo.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openzoo.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log /var/log/nginx/bothot.access.log openzoo;
    error_log /var/log/nginx/bothot.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    # SSR treats literal backslashes as URL separators; reject them before private-path matching.
    if ($uri ~ "\\x5c") { return 400; }
    location ~* ^/(admin(?:/|\.data(?:/|$)|$)|api/(admin|auth|ingest)(?:/|$)|sources(?:/|$)) { return 404; }
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not accept a visitor's forged forwarded IP. Cloudflare peers may share rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
