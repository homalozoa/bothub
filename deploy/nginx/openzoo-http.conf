# Bootstrap only: install before obtaining the openzoo.ai + hub.openzoo.ai certificate.
server {
    listen 80;
    listen [::]:80;
    server_name openzoo.ai hub.openzoo.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
